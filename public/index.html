<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کنتاکتور اینستگرام | اتصال‌دهنده هوشمند</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23833ab4'/%3E%3Cstop offset='.5' stop-color='%23fd1d1d'/%3E%3Cstop offset='1' stop-color='%23fcb045'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Crect x='22' y='22' width='56' height='56' rx='16' fill='none' stroke='white' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='14' fill='none' stroke='white' stroke-width='7'/%3E%3Ccircle cx='69' cy='31' r='5' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">IC</div>
        <div>
          <div class="brand-name">کنتاکتور اینستگرام</div>
          <div class="brand-sub">اتصال‌دهنده هوشمند رسمی</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-view="connect"><span class="nav-ico">🔗</span> اتصال اینستاگرام</button>
        <button class="nav-item" data-view="dashboard"><span class="nav-ico">📊</span> داشبورد</button>
        <button class="nav-item" data-view="studio"><span class="nav-ico">🎨</span> استودیو محتوا</button>
        <button class="nav-item" data-view="publish"><span class="nav-ico">🚀</span> انتشار پست و استوری</button>
        <button class="nav-item" data-view="messages"><span class="nav-ico">💬</span> دایرکت هوشمند <span id="msgBadge" class="badge hidden">۰</span></button>
        <button class="nav-item" data-view="leads"><span class="nav-ico">🎯</span> مشتری و تبلیغات</button>
        <button class="nav-item" data-view="settings"><span class="nav-ico">⚙️</span> تنظیمات ایجنت</button>
      </nav>

      <div class="sidebar-footer">
        <div id="modeBadge" class="mode-badge">در حال بررسی…</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">اتصال اینستاگرام</h1>
        <div class="topbar-right">
          <div id="connBadge" class="conn-badge">متصل نیست</div>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- ویجت شناور چت با ایجنت -->
  <button id="chatFab" class="chat-fab" title="چت با ایجنت">🤖</button>
  <div id="chatPanel" class="chat-panel hidden">
    <div class="chat-head">
      <span>دستیار هوشمند کنتاکتور</span>
      <button id="chatClose" class="icon-btn">✕</button>
    </div>
    <div id="chatBody" class="chat-body"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" type="text" placeholder="درخواست خود را بنویسید…" autocomplete="off" />
      <button type="submit" class="btn btn-primary btn-sm">ارسال</button>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
